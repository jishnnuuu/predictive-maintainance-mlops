seed: 42

data:
  telemetry_frequency: "1h"
  history_hours: 48
  prediction_horizon_hours: 24

split:
  train_end: "2015-08-31 23:00:00"
  validation_end: "2015-10-31 23:00:00"
  test_end: "2015-12-31 23:00:00"

features:
  rolling_windows:
    - 6
    - 12
    - 24
    - 48

  error_window_hours: 24

models:
  baseline:
    type: "xgboost"
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    min_child_weight: 1
    reg_lambda: 1.0
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

  sequence:
    window_hours: 24
    hidden_size: 64
    num_layers: 2
    dropout: 0.2

  transformer:
    window_hours: 24
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.2

training:
  batch_size: 256
  epochs: 10
  learning_rate: 0.0001
  early_stopping_patience: 3
  gradient_clip: 1.0

evaluation:
  threshold: 0.95