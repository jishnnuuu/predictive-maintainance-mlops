name: MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. LINT
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.8.6

      - name: Run ruff
        run: ruff check src/

  # ──────────────────────────────────────────────────────────
  # 2. TEST
  # ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest==8.3.4 pandas==2.2.3 pydantic==2.10.4 \
                      fastapi==0.115.6 httpx xgboost==2.1.4 \
                      scikit-learn==1.6.1 prometheus-client==0.21.1

      - name: Run tests
        run: pytest tests/ -v

  # ──────────────────────────────────────────────────────────
  # 3. TRAIN PIPELINE (DVC repro — XGBoost only for CI speed)
  # ──────────────────────────────────────────────────────────
  train:
    name: DVC Pipeline (XGBoost)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libomp (XGBoost dependency)
        run: sudo apt-get install -y libgomp1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-train-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dvc==3.63.0 pandas==2.2.3 scikit-learn==1.6.1 \
                      xgboost==2.1.4 mlflow==2.19.0 pyyaml==6.0.2

      # Dataset is not in git — copy from DVC cache or use artifact
      # For CI: use a small synthetic dataset to validate the pipeline logic
      - name: Create synthetic dataset for CI
        run: python tests/create_ci_dataset.py

      - name: Run prepare stage
        run: python -m src.data.prepare

      - name: Run features stage
        run: python -m src.features.build_features

      - name: Run train stage
        run: python -m src.models.train

      - name: Run evaluate stage
        run: python -m src.models.evaluate

      - name: Show metrics
        run: cat metrics/baseline_metrics.json

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-model
          path: |
            models/xgboost_baseline.json
            models/xgboost_features.json
            metrics/baseline_metrics.json

  # ──────────────────────────────────────────────────────────
  # 4. DOCKER BUILD
  # ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: xgboost-model
          path: .

      - name: Build Docker image
        run: docker build -t predictive-maintenance-api:ci .

      - name: Smoke-test the API container
        run: |
          docker run -d --name api-test -p 8000:8000 predictive-maintenance-api:ci
          sleep 5
          curl -f http://localhost:8000/health
          docker stop api-test
